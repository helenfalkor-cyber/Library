<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Library</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec;
    --ink: #1a1714;
    --muted: #7a7468;
    --rule: #d9d3c7;
    --a1: #c8e6c9; --a1d: #2e7d32;
    --a2: #b3e0f7; --a2d: #0277bd;
    --b1: #ffe0b2; --b1d: #e65100;
    --b2: #e1bee7; --b2d: #6a1b9a;
    --c1: #fce4ec; --c1d: #880e4f;
    --c2: #cfd8dc; --c2d: #263238;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header {
    padding: 56px 48px 32px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    gap: 20px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: -0.5px;
  }

  header span {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  main {
    padding: 40px 48px 80px;
    max-width: 1100px;
  }

  .level-block {
    margin-bottom: 48px;
  }

  .level-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .level-badge {
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem;
    padding: 4px 14px;
    border-radius: 2px;
    letter-spacing: 0.04em;
  }

  .level-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .level-line {
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  /* Badge colours */
  .a1 .level-badge { background: var(--a1); color: var(--a1d); }
  .a2 .level-badge { background: var(--a2); color: var(--a2d); }
  .b1 .level-badge { background: var(--b1); color: var(--b1d); }
  .b2 .level-badge { background: var(--b2); color: var(--b2d); }
  .c1 .level-badge { background: var(--c1); color: var(--c1d); }
  .c2 .level-badge { background: var(--c2); color: var(--c2d); }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 16px 20px;
    width: 240px;
    text-decoration: none;
    color: var(--ink);
    transition: box-shadow 0.15s, transform 0.15s;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card:hover {
    box-shadow: 0 4px 18px rgba(0,0,0,0.09);
    transform: translateY(-2px);
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.3;
  }

  .card-meta {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  .card-tag {
    display: inline-block;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 2px;
    margin-top: 4px;
    letter-spacing: 0.04em;
    align-self: flex-start;
  }

  .a1 .card-tag { background: var(--a1); color: var(--a1d); }
  .a2 .card-tag { background: var(--a2); color: var(--a2d); }
  .b1 .card-tag { background: var(--b1); color: var(--b1d); }
  .b2 .card-tag { background: var(--b2); color: var(--b2d); }
  .c1 .card-tag { background: var(--c1); color: var(--c1d); }
  .c2 .card-tag { background: var(--c2); color: var(--c2d); }

  /* empty state */
  .empty {
    font-size: 0.8rem;
    color: var(--muted);
    font-style: italic;
    padding: 8px 0;
  }
</style>
</head>
<body>

<header>
  <h1>Lesson Library</h1>
  <span>Elena · English Materials</span>
</header>

<main>

  <!-- ── A1 ── -->
  <div class="level-block a1">
    <div class="level-header">
      <span class="level-badge">A1</span>
      <span class="level-title">Beginner</span>
      <span class="level-line"></span>
    </div>
    <div class="cards">

      <!-- Copy a <a class="card"> block to add more lessons -->

    </div>
  </div>

  <!-- ── A2 ── -->
  <div class="level-block a2">
    <div class="level-header">
      <span class="level-badge">A2</span>
      <span class="level-title">Elementary</span>
      <span class="level-line"></span>
    </div>
    <div class="cards">
      <p class="empty">No lessons yet.</p>
    </div>
  </div>

  <!-- ── B1 ── -->
  <div class="level-block b1">
    <div class="level-header">
      <span class="level-badge">B1</span>
      <span class="level-title">Intermediate</span>
      <span class="level-line"></span>
    </div>
    <div class="cards">
      <p class="empty">No lessons yet.</p>
    </div>
  </div>

  <!-- ── B2 ── -->
  <div class="level-block b2">
    <div class="level-header">
      <span class="level-badge">B2</span>
      <span class="level-title">Upper-Intermediate</span>
      <span class="level-line"></span>
    </div>
    <div class="cards">

      <p class="empty">No lessons yet.</p>

    </div>
  </div>

  <!-- ── C1 ── -->
  <div class="level-block c1">
    <div class="level-header">
      <span class="level-badge">C1</span>
      <span class="level-title">Advanced</span>
      <span class="level-line"></span>
    </div>
    <div class="cards">

      <a class="card" href="fast-fashion.html" target="_blank">
        <span class="card-title">The True Cost — Fast Fashion & Ethics</span>
        <span class="card-meta">Cleft sentences · Discourse markers</span>
        <span class="card-tag">C1</span>
      </a>

    </div>
  </div>

  <!-- ── C2 ── -->
  <div class="level-block c2">
    <div class="level-header">
      <span class="level-badge">C2</span>
      <span class="level-title">Proficiency</span>
      <span class="level-line"></span>
    </div>
    <div class="cards">
      <p class="empty">No lessons yet.</p>
    </div>
  </div>

</main>
</body>
</html>
