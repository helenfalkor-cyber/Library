<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Library</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec;
    --ink: #1a1714;
    --muted: #7a7468;
    --rule: #d9d3c7;
    --a1: #c8e6c9; --a1d: #2e7d32;
    --a2: #b3e0f7; --a2d: #0277bd;
    --b1: #ffe0b2; --b1d: #e65100;
    --b2: #e1bee7; --b2d: #6a1b9a;
    --c1: #fce4ec; --c1d: #880e4f;
    --c2: #cfd8dc; --c2d: #263238;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; }

  header { padding: 56px 48px 32px; border-bottom: 1px solid var(--rule); display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  header h1 { font-family: 'DM Serif Display', serif; font-size: 2.4rem; font-weight: 400; letter-spacing: -0.5px; }
  header span { color: var(--muted); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'DM Mono', monospace; }

  .naming-guide { margin: 0 48px; padding: 12px 20px; background: #fff; border: 1px solid var(--rule); border-top: none; font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--muted); }
  .naming-guide strong { color: var(--ink); }
  .naming-guide code { background: var(--bg); padding: 1px 5px; border-radius: 2px; }

  main { padding: 40px 48px 80px; max-width: 1100px; }

  .loading { display: flex; align-items: center; gap: 12px; padding: 40px 0; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.8rem; letter-spacing: 0.06em; }
  .loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,100% { opacity:0.2; transform:scale(0.8); } 50% { opacity:1; transform:scale(1); } }

  .error-msg { padding: 20px; background: #fff3f3; border: 1px solid #f5c6c6; font-family: 'DM Mono', monospace; font-size: 0.8rem; color: #c0392b; margin: 20px 0; line-height: 1.6; }

  .level-block { margin-bottom: 48px; }
  .level-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .level-badge { font-family: 'DM Serif Display', serif; font-size: 1.05rem; padding: 4px 14px; border-radius: 2px; letter-spacing: 0.04em; }
  .level-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-family: 'DM Mono', monospace; }
  .level-line { flex: 1; height: 1px; background: var(--rule); }

  .a1 .level-badge { background: var(--a1); color: var(--a1d); }
  .a2 .level-badge { background: var(--a2); color: var(--a2d); }
  .b1 .level-badge { background: var(--b1); color: var(--b1d); }
  .b2 .level-badge { background: var(--b2); color: var(--b2d); }
  .c1 .level-badge { background: var(--c1); color: var(--c1d); }
  .c2 .level-badge { background: var(--c2); color: var(--c2d); }

  .cards { display: flex; flex-wrap: wrap; gap: 12px; }

  .card { background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 16px 20px; width: 240px; text-decoration: none; color: var(--ink); transition: box-shadow 0.15s, transform 0.15s; display: flex; flex-direction: column; gap: 6px; animation: fadeIn 0.3s ease forwards; opacity: 0; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.09); transform: translateY(-2px); }
  .card-title { font-size: 0.95rem; font-weight: 500; line-height: 1.3; }
  .card-meta { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.03em; font-family: 'DM Mono', monospace; }

  .card-tag { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 2px; margin-top: 4px; letter-spacing: 0.04em; align-self: flex-start; font-family: 'DM Mono', monospace; }
  .a1 .card-tag { background: var(--a1); color: var(--a1d); }
  .a2 .card-tag { background: var(--a2); color: var(--a2d); }
  .b1 .card-tag { background: var(--b1); color: var(--b1d); }
  .b2 .card-tag { background: var(--b2); color: var(--b2d); }
  .c1 .card-tag { background: var(--c1); color: var(--c1d); }
  .c2 .card-tag { background: var(--c2); color: var(--c2d); }

  .empty { font-size: 0.8rem; color: var(--muted); font-style: italic; font-family: 'DM Mono', monospace; padding: 8px 0; }

  .refresh-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 32px; font-family: 'DM Mono', monospace; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: 1px solid var(--rule); padding: 8px 16px; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
  .refresh-btn:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

<header>
  <h1>Lesson Library</h1>
  <span>English Materials</span>
</header>


<main id="main">
  <div class="loading">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <span>Loading lessons...</span>
  </div>
</main>

<script>
const GITHUB_USER = 'helenfalkor-cyber';
const GITHUB_REPO = 'Library';

const LEVELS = [
  { key: 'a1', label: 'A1', title: 'Beginner' },
  { key: 'a2', label: 'A2', title: 'Elementary' },
  { key: 'b1', label: 'B1', title: 'Intermediate' },
  { key: 'b2', label: 'B2', title: 'Upper-Intermediate' },
  { key: 'c1', label: 'C1', title: 'Advanced' },
  { key: 'c2', label: 'C2', title: 'Proficiency' },
];

function fileToTitle(filename) {
  return filename
    .replace(/^[abc][12]-/i, '')
    .replace(/\.html$/, '')
    .replace(/-/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

async function loadLessons() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><span>Loading lessons...</span></div>';

  try {
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`,
      { headers: { 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
    const files = await res.json();

    const lessons = files.filter(f =>
      f.type === 'file' &&
      f.name.endsWith('.html') &&
      f.name !== 'library.html' &&
      /^[abc][12]-/i.test(f.name)
    );

    const grouped = {};
    LEVELS.forEach(l => grouped[l.key] = []);
    lessons.forEach(file => {
      const prefix = file.name.substring(0, 2).toLowerCase();
      if (grouped[prefix] !== undefined) grouped[prefix].push(file);
    });

    main.innerHTML = '';

    LEVELS.forEach(level => {
      const block = document.createElement('div');
      block.className = `level-block ${level.key}`;

      const levelFiles = grouped[level.key];
      const cardsHTML = levelFiles.length === 0
        ? `<div class="cards"><p class="empty">No lessons yet.</p></div>`
        : `<div class="cards">${levelFiles.map((f, i) => `
            <a class="card" href="${f.name}" target="_blank" style="animation-delay:${i*60}ms">
              <span class="card-title">${fileToTitle(f.name)}</span>
              <span class="card-meta">${f.name}</span>
              <span class="card-tag">${level.label}</span>
            </a>`).join('')}
          </div>`;

      block.innerHTML = `
        <div class="level-header">
          <span class="level-badge">${level.label}</span>
          <span class="level-title">${level.title}</span>
          <span class="level-line"></span>
        </div>
        ${cardsHTML}`;

      main.appendChild(block);
    });

    const btn = document.createElement('button');
    btn.className = 'refresh-btn';
    btn.textContent = '↻ Refresh';
    btn.onclick = loadLessons;
    main.appendChild(btn);

  } catch (err) {
    main.innerHTML = `<div class="error-msg">
      Could not load lessons from GitHub.<br>
      Make sure the repository is <strong>public</strong> and GitHub Pages is enabled.<br><br>
      Error: ${err.message}
    </div>`;
  }
}

loadLessons();
</script>
</body>
</html>
